    const isActive = i === activeModule;
    return `<button onclick="switchModule(${i})" class="flex-shrink-0 flex items-center gap-1.5 text-xs font-semibold px-3.5 py-2 rounded-xl border transition-all duration-150 ${isActive ? c.nav : c.navInactive}">
      <i class="ti ${m.icon} text-sm"></i>
      ${m.label}
    </button>`;
  }).join('');
}

function switchModule(i) {
  activeModule = i; activePrak = 0;
  renderNav(); renderContent();
}
function switchPrak(i) {
  activePrak = i; renderContent();
}

function renderContent() {
  const mod = modules[activeModule];
  const prak = mod.praktikum[activePrak];
  const c = colorMap[mod.color];

  // Count done
  const doneCount = mod.praktikum.filter(p => p.done).length;
  const totalCount = mod.praktikum.length;

  let html = `
  <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
    <!-- Module header -->
    <div class="px-6 pt-5 pb-4 border-b border-slate-100">
      <div class="flex items-start justify-between gap-3">
        <div>
          <h2 class="text-base font-bold text-slate-800">${mod.title}</h2>
          <p class="text-sm text-slate-500 mt-0.5 leading-relaxed">${mod.desc}</p>
        </div>
        <div class="flex-shrink-0 text-right">
          <div class="text-xs text-slate-400">Progress</div>
          <div class="text-sm font-bold text-slate-700">${doneCount}/${totalCount}</div>
        </div>
      </div>
      <!-- Progress bar -->
      <div class="mt-3 h-1.5 bg-slate-100 rounded-full overflow-hidden">
        <div class="progress-fill h-full bg-gradient-to-r from-blue-500 to-indigo-500 rounded-full" style="width:${totalCount > 0 ? (doneCount/totalCount*100) : 0}%"></div>
      </div>
    </div>

    <!-- Praktikum tabs -->
    <div class="flex gap-2 px-5 py-3 bg-slate-50 border-b border-slate-100 overflow-x-auto">
      ${mod.praktikum.map((p,i) => `
        <button onclick="switchPrak(${i})" class="flex-shrink-0 flex items-center gap-1.5 text-xs font-semibold px-3.5 py-2 rounded-xl border transition-all duration-150 ${i===activePrak ? c.tab : c.tabInactive}">
          ${p.done ? '<i class="ti ti-circle-check text-sm"></i>' : `<i class="ti ${p.icon} text-sm"></i>`}
          ${p.title}
          ${p.done ? '<span class="ml-1 text-[10px] opacity-75">✓</span>' : ''}
        </button>`).join('')}
    </div>

    <!-- Praktikum content -->
    <div class="p-5">
      <!-- Prak header -->
      <div class="flex items-start gap-3 mb-4">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0 ${prak.iconBg}">
          <i class="ti ${prak.icon} text-xl ${prak.iconColor}"></i>
        </div>
        <div>
          <h3 class="text-sm font-bold text-slate-800">${prak.title}</h3>
          <p class="text-xs text-slate-500 mt-0.5">Tujuan: ${prak.goal}</p>
        </div>
        ${prak.done ? '<span class="ml-auto bg-green-100 text-green-700 text-xs font-semibold px-2.5 py-1 rounded-full flex-shrink-0">✓ Selesai</span>' : ''}
      </div>

      <!-- Scenario box -->
      <div class="bg-blue-50 border-l-4 border-blue-400 rounded-r-xl px-4 py-3 mb-5">
        <div class="text-xs font-bold text-blue-600 mb-1 uppercase tracking-wide">📋 Skenario</div>
        <p class="text-sm text-slate-700 leading-relaxed">${prak.scenario || getSenario(prak)}</p>
      </div>

      ${renderPraktikum(prak)}
    </div>
  </div>`;

  document.getElementById('mainContent').innerHTML = html;
  attachEvents(prak);
}

function getSenario(prak) {
  const map = {
    'p2a': 'Anda menerima email di kotak masuk kantor. Klik pada teks yang dihighlight untuk menandai red flag (tanda bahaya) dalam email ini.',
    'p3a': 'Analis OSINT sedang menginvestigasi profil digital "Pak Hendra Kusuma", seorang pejabat fiktif. Informasi di bawah dikumpulkan dari sumber terbuka. Identifikasi risiko keamanan dari setiap data.',
    'p4b': 'Ikuti perjalanan digital Pak Budi, seorang staf IT Kemendikbud, dan lihat bagaimana postingan yang tampak tidak berbahaya menciptakan konsekuensi nyata bertahun-tahun kemudian.',
    'p5b': 'Susun kebijakan penggunaan media sosial untuk instansi Anda. Pilih poin-poin kebijakan yang tepat dan kategorikan dengan benar.',
    'p1a': 'Terjadi insiden: laptop staf ditemukan terinfeksi malware yang aktif mengirim data keluar. Urutkan langkah respons insiden yang benar.',
  };
  return map[prak.id] || '';
}

function renderPraktikum(prak) {
  if (prak.type === 'classify') return renderClassify(prak);
  if (prak.type === 'logdetect') return renderLogDetect(prak);
  if (prak.type === 'order') return renderOrder(prak);
  if (prak.type === 'form_report') return renderFormReport(prak);
  if (prak.type === 'quiz') return renderQuiz(prak);
  if (prak.type === 'phishing') return renderPhishing(prak);
  if (prak.type === 'osint_sim') return renderOsint(prak);
  if (prak.type === 'timeline_sim') return renderTimeline(prak);
  if (prak.type === 'policy_builder') return renderPolicyBuilder(prak);
  return '';
}

// ========== CLASSIFY ==========
function renderClassify(prak) {
  const item = prak.items[prak.current];
  const total = prak.items.length;
  const pct = (prak.current / total) * 100;
  if (prak.done && prak.current >= total) {
    const pass = prak.score >= total * 0.75;
    return resultBanner(pass,
      pass ? 'Selamat! Anda berhasil mengklasifikasikan insiden dengan baik.' : 'Perlu belajar lebih lanjut tentang jenis-jenis insiden siber.',
      `Skor: ${prak.score}/${total} · ${Math.round(prak.score/total*100)}% jawaban benar`
    );
  }
  return `
    ${progressBar(pct)}
    <div class="text-xs text-slate-500 mb-3 font-medium">Laporan ${prak.current+1} dari ${total}</div>
    <div class="bg-slate-50 rounded-xl px-4 py-3 text-sm font-medium text-slate-800 mb-4 border border-slate-200">"${item.text}"</div>
    <div class="flex flex-col gap-2" id="classifyOpts">
      ${item.categories.map((c,i) => `
        <div onclick="classifyAnswer(${i})" data-idx="${i}" class="option-card flex items-center gap-3 px-4 py-3 rounded-xl border border-slate-200 cursor-pointer bg-white hover:bg-slate-50 hover:border-slate-300 text-sm text-slate-700">
          <span class="w-7 h-7 rounded-lg bg-slate-100 flex items-center justify-center text-xs font-bold text-slate-500 flex-shrink-0">${String.fromCharCode(65+i)}</span>
          ${c}
        </div>`).join('')}
    </div>
    <div class="hidden mt-3 rounded-xl px-4 py-3 text-sm" id="classifyFb"></div>`;
}

    </div>

      <div class="text-xs font-semibold text-slate-600 mb-2">Tindakan yang harus segera diambil:</div>

        ${prak.actions.map((a,i) => `

            <span class="w-7 h-7 rounded-lg ${prak._logAction===i?'bg-blue-100':'bg-slate-100'} flex items-center justify-center text-xs font-bold ${prak._logAction===i?'text-blue-600':'text-slate-500'} flex-shrink-0">${String.fromCharCode(65+i)}</span>

        <i class="ti ti-flag text-sm"></i> Dipilih: <span id="logSelCount" class="text-slate-800">${prak.selected.length}</span> baris
      </span>
      <button onclick="checkLog()" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-5 py-2 rounded-xl transition-all">Periksa Jawaban</button>
    </div>
    ${prak.done ? resultBanner(true,'Analisis Log Selesai!','Anda telah mengidentifikasi pola serangan: login dini hari dari luar negeri, unduhan data masif, dan akses file anomali. Segera nonaktifkan akun dan lakukan forensik digital.') : ''}`;

// ========== ORDER / DRAG ==========
function renderOrder(prak) {
  if (!prak._shuffled) {
    prak._shuffled = true;
    prak._shuffleOrder = prak.items.map((_,i)=>i).sort(()=>Math.random()-0.5);
    prak._displayItems = prak._shuffleOrder.map(i=>prak.items[i]);
    prak._placedItems = [];
  }
  return `
    <div class="grid grid-cols-2 gap-4 mb-4">
      <div>
        <div class="flex items-center gap-1.5 text-xs font-bold text-slate-500 uppercase tracking-wide mb-2"><i class="ti ti-cards text-sm"></i> Bank Langkah</div>
        <div class="min-h-20 border-2 border-dashed border-slate-200 rounded-xl p-2 flex flex-col gap-1.5" id="bankCol">
          ${prak._displayItems.filter((_,i) => !prak._placedItems.includes(i)).map((item) => {
            const idx = prak._displayItems.indexOf(item);
            return `<div class="drag-item bg-white border border-slate-200 rounded-lg px-3 py-2 text-xs font-medium text-slate-700 hover:shadow-sm" draggable="true" data-item="${idx}" ondragstart="dragStart(event)" onclick="moveToPlaced(${idx})">${item}</div>`;
          }).join('')}
        </div>
      </div>
      <div>
        <div class="flex items-center gap-1.5 text-xs font-bold text-slate-500 uppercase tracking-wide mb-2"><i class="ti ti-list-numbers text-sm"></i> Urutan Respons</div>
        <div class="min-h-20 border-2 border-dashed border-blue-200 bg-blue-50/50 rounded-xl p-2 flex flex-col gap-1.5" id="placedCol" ondragover="event.preventDefault()" ondrop="dropToPlaced(event)">
          ${prak._placedItems.map((i,pos) => `<div class="drag-item bg-blue-50 border border-blue-200 rounded-lg px-3 py-2 text-xs font-medium text-blue-800 flex items-center gap-2"><span class="text-blue-400 font-bold w-4">${pos+1}.</span>${prak._displayItems[i]}</div>`).join('')}
        </div>
      </div>
    </div>
    <div class="flex items-center justify-between gap-3">
      <button onclick="resetOrder()" class="text-sm font-semibold px-4 py-2 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50 transition-all">↺ Reset</button>
      <button onclick="checkOrder()" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-5 py-2 rounded-xl transition-all">Periksa Urutan</button>
    </div>
    ${prak.done ? resultBanner(true,'Urutan respons insiden sudah tepat!','Identifikasi → Isolasi → Catat → Lapor → Analisis → Pulihkan → Evaluasi. Ingat: JANGAN matikan perangkat sebelum isolasi jaringan karena bisa menghapus bukti forensik.') : ''}`;
}

// ========== FORM REPORT ==========
function renderFormReport(prak) {
  return `
    <div class="flex flex-col gap-3 mb-5" id="formFields">
      ${prak.fields.map(f => `
        <div class="border border-slate-200 rounded-xl p-3.5">
          <label class="block text-xs font-bold text-slate-700 mb-1">${f.label}</label>
          <div class="flex items-center gap-1 text-xs text-slate-400 mb-2"><i class="ti ti-info-circle text-sm"></i> ${f.hint}</div>
          <input type="text" placeholder="${f.placeholder}" id="field_${f.key}" value="${prak.values[f.key]||''}" oninput="updateField('${f.key}', this.value)"
            class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-300 focus:border-blue-400 placeholder:text-slate-300 transition-all">
          <div class="hidden mt-2 rounded-lg px-3 py-2 text-xs" id="fb_${f.key}" style="display:${prak.checked?'block':'none'};"></div>
        </div>`).join('')}

    <div class="flex items-center justify-between gap-3">
      <p class="text-xs text-slate-400">Isi semua kolom berdasarkan skenario di atas</p>
      <button onclick="checkForm()" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-5 py-2 rounded-xl transition-all">Kirim Laporan</button>
    </div>
    ${prak.done ? resultBanner(true,'Laporan insiden berhasil disusun!','Laporan yang lengkap dan akurat sangat penting untuk respons insiden yang efektif.') : ''}`;
}

// ========== QUIZ ==========
function renderQuiz(prak) {
  if (prak.current >= prak.questions.length) {
    const pass = prak.score >= prak.questions.length * 0.67;
    return resultBanner(pass,
      pass ? '🎉 Selamat! Pemahaman Anda sangat baik.' : 'Perlu peningkatan pemahaman.',
      `Skor akhir: ${prak.score}/${prak.questions.length} · ${Math.round(prak.score/prak.questions.length*100)}%`,
      true
    );
  }
  const q = prak.questions[prak.current];
  const pct = (prak.current / prak.questions.length) * 100;
  return `
    ${progressBar(pct)}
    <div class="text-xs text-slate-400 mb-3 font-medium">Pertanyaan ${prak.current+1} dari ${prak.questions.length}</div>
    <div class="text-sm font-semibold text-slate-800 mb-4 leading-relaxed">${q.q}</div>
    <div class="flex flex-col gap-2 mb-4" id="quizOpts">
      ${q.options.map((o,i) => {
        let cls = 'border-slate-200 bg-white hover:bg-slate-50 text-slate-700';
        if (prak.locked) {
          if (i === q.answer) cls = 'border-green-400 bg-green-50 text-green-700';
          else if (i === prak.selectedOption) cls = 'border-red-400 bg-red-50 text-red-700';
          else cls = 'border-slate-100 bg-slate-50 text-slate-400 opacity-60';
        } else if (prak.selectedOption === i) {
          cls = 'border-blue-400 bg-blue-50 text-blue-700';
        }
        return `<div onclick="selectQuizOption(${i})" data-qi="${i}" class="option-card ${prak.locked?'locked-opt':''} flex items-center gap-3 px-4 py-3 rounded-xl border cursor-pointer text-sm transition-all ${cls}">
          <span class="w-7 h-7 rounded-lg flex items-center justify-center text-xs font-bold flex-shrink-0 ${prak.locked && i===q.answer ? 'bg-green-100 text-green-600' : prak.locked && i===prak.selectedOption && i!==q.answer ? 'bg-red-100 text-red-600' : prak.selectedOption===i?'bg-blue-100 text-blue-600':'bg-slate-100 text-slate-500'}">${String.fromCharCode(65+i)}</span>
          ${o}
        </div>`;
      }).join('')}
    </div>
    ${prak.locked ? `<div class="rounded-xl px-4 py-3 text-sm mb-4 ${prak.selectedOption===q.answer?'bg-green-50 border border-green-200 text-green-800':'bg-red-50 border border-red-200 text-red-800'}">${prak.selectedOption===q.answer?'✓':'✗'} ${q.feedback}</div>` : ''}
    <div class="flex items-center justify-between gap-3">
      <span class="inline-flex items-center gap-1.5 bg-slate-100 text-slate-600 text-xs font-semibold px-3 py-1.5 rounded-full">
        <i class="ti ti-star text-sm"></i> Skor: <span class="text-slate-800">${prak.score}</span>
      </span>
      ${!prak.locked
        ? `<button onclick="submitQuiz()" ${prak.selectedOption===null?'disabled':''} class="bg-blue-600 hover:bg-blue-700 disabled:opacity-40 disabled:cursor-not-allowed text-white text-sm font-semibold px-5 py-2 rounded-xl transition-all">Konfirmasi Jawaban</button>`
        : `<button onclick="nextQuestion()" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-5 py-2 rounded-xl transition-all">Berikutnya →</button>`}
    </div>`;
}

// ========== TIMELINE ==========
function renderTimeline(prak) {
  const events = [
    { year: "2022", title: "Posting Foto Rapat Sensasional", desc: "Pak Budi memposting foto suasana rapat dengan dokumen anggaran terlihat jelas di meja. Dibagikan 47 kali.", icon: "ti-camera", danger: false },
    { year: "2023", title: "Komentar Kontroversi Terhapus", desc: "Budi menghapus komentar kritik terhadap kebijakan. Tapi sudah di-screenshot dan tersebar di grup WhatsApp internal.", icon: "ti-message-x", danger: true },
    { year: "2023", title: "Data Ditemukan di Breach", desc: "Email kantor Budi muncul di database breach. Kemungkinan akibat penggunaan email dinas untuk akun non-resmi.", icon: "ti-database-x", danger: true },
    { year: "2024", title: "Dipanggil Atasan", desc: "Screenshot komentar 2023 beredar saat Budi mengajukan promosi. Proses promosi tertunda untuk investigasi.", icon: "ti-user-exclamation", danger: false },
    { year: "2025", title: "Audit Keamanan Diperluas", desc: "Tim keamanan menemukan pola: foto 2022 berisi metadata lokasi server room. Digunakan pihak tak dikenal untuk pemetaan infrastruktur.", icon: "ti-shield-x", danger: true },
  ];
  if (!prak._step) prak._step = 0;
  return `
    <div class="flex flex-col mb-4">
      ${events.map((e,i) => `
        <div class="flex gap-3">
          <div class="flex flex-col items-center">
            <div onclick="advanceTimeline(${i})" class="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0 cursor-pointer text-xs font-bold border-2 transition-all ${
              i < prak._step ? (e.danger?'bg-red-100 border-red-300 text-red-600':'bg-amber-100 border-amber-300 text-amber-700') :
              i === prak._step ? 'bg-blue-100 border-blue-400 text-blue-700 shadow-sm' :
              'bg-white border-slate-200 text-slate-400'
            }">
              ${i < prak._step ? '<i class="ti ti-check text-sm"></i>' : `<span>${e.year.slice(2)}</span>`}
            </div>
            ${i < events.length-1 ? '<div class="tl-connector"></div>' : ''}
          </div>
          <div class="flex-1 pb-4 pt-1" style="opacity:${i<=prak._step?1:0.35}; transition:opacity 0.3s;">
            <div class="text-xs font-bold ${i<=prak._step?(e.danger?'text-red-600':'text-amber-700'):'text-slate-400'} flex items-center gap-1.5 mb-0.5">
              <i class="ti ${e.icon} text-sm"></i> ${e.year}: ${e.title}
            </div>
            ${i <= prak._step
              ? `<p class="text-xs text-slate-600 leading-relaxed">${e.desc}</p>`
              : `<p class="text-xs text-slate-400 italic">Klik lingkaran untuk ungkap kejadian...</p>`}
          </div>
        </div>`).join('')}
    </div>
    <div class="flex items-center justify-between gap-3">
      <span class="inline-flex items-center gap-1.5 bg-slate-100 text-slate-600 text-xs font-semibold px-3 py-1.5 rounded-full">
        <i class="ti ti-timeline text-sm"></i> Tahap: <span class="text-slate-800">${prak._step}</span>/${events.length}
      </span>
      ${prak._step >= events.length
        ? `<button class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-5 py-2 rounded-xl transition-all">✓ Simulasi Selesai</button>`
        : `<button onclick="advanceTimeline(${prak._step})" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-5 py-2 rounded-xl transition-all">Lanjut →</button>`}
    </div>`;
}

// ========== POLICY BUILDER ==========
function renderPolicyBuilder(prak) {
  const allPolicies = [
    { text: "Jangan posting foto yang menampilkan dokumen, layar komputer, atau informasi sensitif", correct: true },
    { text: "Gunakan akun media sosial pribadi untuk keperluan dinas jika lebih mudah", correct: false },
    { text: "Aktifkan autentikasi dua faktor di semua akun media sosial", correct: true },
    { text: "Boleh share informasi proyek jika tidak menyebutkan nama kementerian", correct: false },
    { text: "Laporkan akun impersonasi atau konten hoaks terkait instansi ke IT Security", correct: true },
    { text: "Review pengaturan privasi akun media sosial secara berkala (3-6 bulan sekali)", correct: true },
    { text: "Password media sosial boleh sama dengan password akun dinas untuk kemudahan", correct: false },
    { text: "Jangan menerima permintaan pertemanan dari akun yang tidak dikenal", correct: true },
    { text: "Kritik kebijakan instansi diperbolehkan asalkan di akun anonim", correct: false },
    { text: "Ikuti pelatihan keamanan siber yang diselenggarakan instansi", correct: true },
  ];
  if (!prak._selected) prak._selected = [];
  const selCount = prak._selected.length;
  return `
    <div class="text-sm text-slate-700 mb-4">Pilih semua pernyataan yang <strong class="text-slate-900">TEPAT</strong> untuk dijadikan poin kebijakan media sosial instansi:</div>
    <div class="flex flex-wrap gap-2 mb-5" id="policyItems">
      ${allPolicies.map((p,i) => {
        let cls = 'border-slate-200 bg-white text-slate-700 hover:border-slate-300';
        if (prak._checked) {
          if (p.correct) cls = 'border-green-400 bg-green-50 text-green-800';
          else if (prak._selected.includes(i)) cls = 'border-red-400 bg-red-50 text-red-700';
          else cls = 'border-slate-100 bg-slate-50 text-slate-400 opacity-50';
        } else if (prak._selected.includes(i)) {
          cls = 'border-blue-400 bg-blue-50 text-blue-700';
        }
        return `<div onclick="togglePolicy(${i})" class="classify-chip flex items-center gap-1.5 text-xs font-medium px-3.5 py-2 rounded-xl border cursor-pointer ${cls}">
          ${prak._checked ? `<i class="ti ${p.correct?'ti-check':'ti-x'} text-sm"></i>` : ''}
          ${p.text}
        </div>`;
      }).join('')}
    </div>
    <div class="flex items-center justify-between gap-3">
      <span class="inline-flex items-center gap-1.5 bg-slate-100 text-slate-600 text-xs font-semibold px-3 py-1.5 rounded-full">
        <i class="ti ti-checklist text-sm"></i> Dipilih: <span class="text-slate-800">${selCount}</span> poin
      </span>
      ${!prak._checked ? `<button onclick="checkPolicy()" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-5 py-2 rounded-xl transition-all">Periksa Kebijakan</button>` : ''}
    </div>
    ${prak._checked ? (() => {
      const correctCount = prak._selected.filter(i=>allPolicies[i].correct).length;
      const pass = correctCount >= 5;
      return resultBanner(pass,
        pass ? 'Kebijakan media sosial berhasil disusun!' : 'Masih ada poin yang perlu diperbaiki.',
        `Benar: ${correctCount} dari 6 poin tepat. Hijau = tepat, merah = salah dipilih.`
      );
    })() : ''}`;
}

// ========== HELPERS ==========
function progressBar(pct) {
  return `<div class="h-1.5 bg-slate-100 rounded-full mb-4 overflow-hidden">
    <div class="progress-fill h-full bg-gradient-to-r from-blue-500 to-indigo-500 rounded-full" style="width:${pct}%"></div>
  </div>`;
}

function resultBanner(pass, title, body, showReset=false) {
  return `<div class="mt-4 rounded-xl px-4 py-4 border ${pass?'bg-green-50 border-green-200 text-green-800':'bg-amber-50 border-amber-200 text-amber-800'}">
    <div class="font-bold text-sm mb-1">${pass?'✅':'⚠️'} ${title}</div>
    <div class="text-xs leading-relaxed">${body}</div>
    ${showReset ? `<button onclick="resetQuiz()" class="mt-3 text-xs font-semibold px-3 py-1.5 rounded-lg border ${pass?'border-green-300 hover:bg-green-100':'border-amber-300 hover:bg-amber-100'} transition-all">↺ Ulangi Quiz</button>` : ''}
  </div>`;
}

// ========== EVENTS ==========
function attachEvents() {}

function classifyAnswer(idx) {
  const prak = modules[activeModule].praktikum[activePrak];
  if (prak._answering) return;
  const item = prak.items[prak.current];
  prak._answering = true;
  const opts = document.querySelectorAll('#classifyOpts > div');
  opts.forEach((o,i) => {
    if (i === item.answer) { o.classList.remove('border-slate-200','bg-white'); o.classList.add('border-green-400','bg-green-50','text-green-700'); }
    else if (i === idx && idx !== item.answer) { o.classList.remove('border-slate-200','bg-white'); o.classList.add('border-red-400','bg-red-50','text-red-700'); }
  });
  const fb = document.getElementById('classifyFb');
  const correct = idx === item.answer;
  // if (correct) prak.score++;
  // fb.textContent = item.feedback;
  if (correct) {
    prak.score++;
    fb.textContent = item.feedback;
  } else {
    fb.textContent = item.wrongFeedback;
  }

  fb.className = `mt-3 rounded-xl px-4 py-3 text-sm ${correct?'bg-green-50 border border-green-200 text-green-800':'bg-red-50 border border-red-200 text-red-800'}`;
  setTimeout(() => {
    prak.current++;
    prak._answering = false;
    if (prak.current >= prak.items.length) prak.done = true;
    renderContent();
  }, 5000);
}

function toggleLog(idx) {
  const prak = modules[activeModule].praktikum[activePrak];
  if (prak.done) return;
  const i = prak.selected.indexOf(idx);
  if (i > -1) prak.selected.splice(i,1);
  else prak.selected.push(idx);
  renderContent();
}

function selectLogAction(idx) {
  const prak = modules[activeModule].praktikum[activePrak];
  prak._logAction = idx;
  renderContent();
}

function checkLog() {
  const prak = modules[activeModule].praktikum[activePrak];
  const fb = document.getElementById('logFb');
  const suspiciousIdx = prak.logs.map((l,i)=>l.suspicious?i:-1).filter(i=>i>-1);
  const correctSelected = suspiciousIdx.every(i=>prak.selected.includes(i));
  const correctAction = prak._logAction === prak.correctAction;
  if (correctSelected && correctAction) {
    fb.textContent = 'Benar! Anda mengidentifikasi semua aktivitas mencurigakan dan memilih tindakan yang tepat.';
    fb.className = 'mt-3 rounded-xl px-4 py-3 text-sm bg-green-50 border border-green-200 text-green-800';
    prak.done = true;
    renderContent();
  } else {
    fb.textContent = `${!correctSelected?'Beberapa log mencurigakan terlewat. ':''}${!correctAction?'Tindakan yang dipilih kurang tepat.':''}`;
    fb.className = 'mt-3 rounded-xl px-4 py-3 text-sm bg-red-50 border border-red-200 text-red-800';
  }
}

function moveToPlaced(idx) {
  const prak = modules[activeModule].praktikum[activePrak];
  if (!prak._placedItems.includes(idx)) { prak._placedItems.push(idx); renderContent(); }
}

function resetOrder() {
  const prak = modules[activeModule].praktikum[activePrak];
  prak._placedItems = [];
  renderContent();
}

function checkOrder() {
  const prak = modules[activeModule].praktikum[activePrak];
  const placed = prak._placedItems.map(i => prak._displayItems[i]);
  const isCorrect = placed.length === prak.items.length && placed.every((item,i) => item === prak.items[i]);
  if (isCorrect) { prak.done = true; renderContent(); }
  else {
    const existing = document.querySelector('.order-feedback');
    if (!existing) {
      const fb = document.createElement('div');
      fb.className = 'order-feedback mt-3 rounded-xl px-4 py-3 text-sm bg-red-50 border border-red-200 text-red-800';
      fb.textContent = 'Urutan belum tepat. Pastikan semua langkah sudah di kolom kanan dan urutannya logis.';
      document.querySelector('.flex.items-center.justify-between').insertAdjacentElement('beforebegin', fb);
    }
  }
}

let dragSrcIdx = null;
function dragStart(e) { dragSrcIdx = parseInt(e.target.dataset.item); }
function dropToPlaced(e) {
  e.preventDefault();
  if (dragSrcIdx !== null) { moveToPlaced(dragSrcIdx); dragSrcIdx = null; }
}

function updateField(key, val) {
  const prak = modules[activeModule].praktikum[activePrak];
  prak.values[key] = val;
}

function checkForm() {
  const prak = modules[activeModule].praktikum[activePrak];
  prak.checked = true;
  let allCorrect = true;
  prak.fields.forEach(f => {
    const val = (prak.values[f.key] || '').toLowerCase();
    const correct = f.correct.some(c => val.includes(c));
    const fb = document.getElementById(`fb_${f.key}`);
    if (fb) {
      fb.style.display = 'block';
      fb.className = `mt-2 rounded-lg px-3 py-2 text-xs font-medium ${correct?'bg-green-50 border border-green-200 text-green-700':'bg-red-50 border border-red-200 text-red-700'}`;
      fb.textContent = correct ? '✓ Tepat!' : `✗ Perlu diperbaiki. Petunjuk: ${f.hint}`;
    }
    if (!correct) allCorrect = false;
  });
  if (allCorrect) { prak.done = true; renderContent(); }
}

function selectQuizOption(idx) {
  const prak = modules[activeModule].praktikum[activePrak];
  if (prak.locked) return;
  prak.selectedOption = idx;
  renderContent();
}

function submitQuiz() {
  const prak = modules[activeModule].praktikum[activePrak];
  if (prak.selectedOption === null) return;
  prak.locked = true;
  const q = prak.questions[prak.current];
  if (prak.selectedOption === q.answer) prak.score++;
  renderContent();
}

function nextQuestion() {
  const prak = modules[activeModule].praktikum[activePrak];
  prak.current++;
  prak.selectedOption = null;
  prak.locked = false;
  if (prak.current >= prak.questions.length) prak.done = true;
  renderContent();
}

function resetQuiz() {
  const prak = modules[activeModule].praktikum[activePrak];
  prak.current = 0; prak.score = 0; prak.selectedOption = null; prak.locked = false; prak.done = false;
  renderContent();
}

function markFlag(idx) {
  const prak = modules[activeModule].praktikum[activePrak];
  prak._flags[idx] = true;
  if (prak._flags.filter(Boolean).length >= 5) prak.done = true;
  renderContent();
}

function toggleOsintRisk(idx) {
  const prak = modules[activeModule].praktikum[activePrak];
  if (!prak._revealed) prak._revealed = new Array(6).fill(false);
  prak._revealed[idx] = true;
  if (prak._revealed.filter(Boolean).length >= 6) prak.done = true;
  renderContent();
}

function advanceTimeline(step) {
  const prak = modules[activeModule].praktikum[activePrak];
  if (prak._step <= step) prak._step = step + 1;
  if (prak._step >= 5) prak.done = true;
  renderContent();
}

function togglePolicy(idx) {
  const prak = modules[activeModule].praktikum[activePrak];
  if (prak._checked) return;
  if (!prak._selected) prak._selected = [];
  const i = prak._selected.indexOf(idx);
  if (i > -1) prak._selected.splice(i,1);
  else prak._selected.push(idx);
  renderContent();
}

function checkPolicy() {
  const prak = modules[activeModule].praktikum[activePrak];
  prak._checked = true; prak.done = true;
  renderContent();
}

renderNav();
renderContent();
</script>
</body>
</html>
